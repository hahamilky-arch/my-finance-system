name: Market Data Pipeline

on:
  schedule:
    # 한국 시간 기준 17:00 (UTC 08:00) -> KR 시장 분석
    - cron: '0 8 * * *'
    # 한국 시간 기준 08:00 (UTC 23:00) -> US 시장 분석
    - cron: '0 23 * * *'
  workflow_dispatch:
    inputs:
      market:
        description: 'Target Market (KR or US)'
        required: true
        default: 'KR'
        type: choice
        options:
          - KR
          - US
      start_date:
        description: 'Start Date (YYYY-MM-DD, optional)'
        required: false
        type: string
      end_date:
        description: 'End Date (YYYY-MM-DD, optional for period)'
        required: false
        type: string

jobs:
  sync-and-analyze:
    runs-on: ubuntu-latest
    concurrency:
      group: market-pipeline-${{ github.event.inputs.market || 'schedule' }}
      cancel-in-progress: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        
      - name: Set up Python
        uses: actions/setup-python@v4
        with: 
          python-version: '3.9'

      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}

      - name: Install dependencies
        run: pip install yfinance supabase pandas python-dotenv scipy finance-datareader
      
      - name: Execute Pipeline
        run: |
          # 1. 시장 결정
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            MARKET="${{ github.event.inputs.market }}"
          elif [ "${{ github.event.schedule }}" == "0 8 * * *" ]; then
            MARKET="KR"
          else
            MARKET="US"
          fi
          
          START_DATE="${{ github.event.inputs.start_date }}"
          END_DATE="${{ github.event.inputs.end_date }}"
          
          # 2. 기간(Start ~ End)이 모두 입력된 경우 run_pipeline에 기간 인자 전달
          if [ -n "$START_DATE" ] && [ -n "$END_DATE" ]; then
            echo "=== Executing Pipeline for $MARKET ($START_DATE ~ $END_DATE) ==="
            python run_pipeline.py --market "$MARKET" --start_date "$START_DATE" --end_date "$END_DATE"
          
          # 3. 단일 날짜만 입력된 경우 target_date 전달
          elif [ -n "$START_DATE" ]; then
            echo "=== Executing Pipeline for $MARKET on target date $START_DATE ==="
            python run_pipeline.py --market "$MARKET" --target_date "$START_DATE"
          
          # 4. 입력값이 없는 경우 (정기 스케줄 실행 등) 기본 일일 파이프라인 실행
          else
            echo "=== Executing Daily Pipeline for $MARKET ==="
            python run_pipeline.py --market "$MARKET"
          fi
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
