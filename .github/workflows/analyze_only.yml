name: Analysis Pipeline Only

on:
  workflow_dispatch:
    inputs:
      market:
        description: 'Target Market (KR or US)'
        required: true
        default: 'KR'
        type: choice
        options:
          - KR
          - US
      start_date:
        description: 'Start Date (YYYY-MM-DD, optional)'
        required: false
        type: string
      end_date:
        description: 'End Date (YYYY-MM-DD, optional for period)'
        required: false
        type: string

jobs:
  run-analysis:
    runs-on: ubuntu-latest
    concurrency:
      group: analysis-pipeline-${{ github.event.inputs.market }}
      cancel-in-progress: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        
      - name: Set up Python
        uses: actions/setup-python@v4
        with: 
          python-version: '3.9'

      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}

      - name: Install dependencies
        run: pip install supabase pandas python-dotenv scipy
      
      - name: Execute Analysis Only Pipeline
        run: |
          MARKET="${{ github.event.inputs.market }}"
          START_DATE="${{ github.event.inputs.start_date }}"
          END_DATE="${{ github.event.inputs.end_date }}"
          
          # 파이썬 스크립트에 인자 전달 실행
          if [ -n "$START_DATE" ] && [ -n "$END_DATE" ]; then
            echo "=== Executing Analysis Only for $MARKET ($START_DATE ~ $END_DATE) ==="
            python run_analysis_only.py --market "$MARKET" --start_date "$START_DATE" --end_date "$END_DATE"
          elif [ -n "$START_DATE" ]; then
            echo "=== Executing Analysis Only for $MARKET on target date $START_DATE ==="
            python run_analysis_only.py --market "$MARKET" --target_date "$START_DATE"
          else
            echo "=== Executing Analysis Only for $MARKET (Latest) ==="
            python run_analysis_only.py --market "$MARKET"
          fi
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
