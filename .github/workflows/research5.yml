name: Strategy Research 5 (breakout)

on:
  workflow_dispatch:
    inputs:
      market:
        description: '시장'
        required: true
        default: 'KR'
        type: choice
        options: [KR, US, both]
      start_date:
        description: '데이터 시작일'
        required: true
        default: '2026-01-02'
      end_date:
        description: '종료일'
        required: true
        default: '2026-12-31'
      since:
        description: '하락장 이후 구간을 따로 보려면 2026-05-01 (비워도 전체는 평가)'
        required: false
        default: ''
      drop_outliers:
        description: '일간 ±30% 초과 변동 종목 제외'
        type: boolean
        default: true
      folds:
        description: '평가 기간 분할 수'
        required: true
        default: '3'

jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
    - name: 📦 의존성 설치
      run: |
        python -m pip install --upgrade pip
        pip install pandas numpy supabase tabulate
    - name: 🔬 5차(돌파 전략) 검증 실행
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      run: python research5.py --market ${{ inputs.market }} --start ${{ inputs.start_date }} --end ${{ inputs.end_date }} --since "${{ inputs.since }}" --folds ${{ inputs.folds }} $([ "${{ inputs.drop_outliers }}" = "true" ] && echo --drop_outliers)
    - name: 📎 결과 업로드
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: research5-result
        path: research5_out/
