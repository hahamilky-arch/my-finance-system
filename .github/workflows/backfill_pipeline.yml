name: Manual Backfill Pipeline

on:
  # 백필 및 수동 데이터 보정 전용 워크플로우 (웹 UI 수동 실행)
  workflow_dispatch:
    inputs:
      market:
        description: 'Target Market (KR or US)'
        required: true
        default: 'KR'
        type: choice
        options:
          - KR
          - US
      start_date:
        description: 'Start Date (YYYY-MM-DD)'
        required: true
        type: string
      end_date:
        description: 'End Date (YYYY-MM-DD)'
        required: true
        type: string

jobs:
  run-backfill:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Execute Backfill Script
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        TRADE_PASSWORD: ${{ secrets.TRADE_PASSWORD }}
      run: |
        echo "=== [GitHub Action] 백필 파이프라인 시작 ==="
        echo "시장: ${{ github.event.inputs.market }}"
        echo "기간: ${{ github.event.inputs.start_date }} ~ ${{ github.event.inputs.end_date }}"
        
        python run_backfill_pipeline.py \
          --start "${{ github.event.inputs.start_date }}" \
          --end "${{ github.event.inputs.end_date }}" \
          --market "${{ github.event.inputs.market }}"
