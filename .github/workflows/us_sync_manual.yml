name: Manual Stock Sync (Strict Ticket Required)

on:
  workflow_dispatch:
    inputs:
      ticker:
        description: '동기화할 종목 티커 입력 (필수 입력)'
        required: true
        type: string

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Ticker Input
        run: |
          # 입력된 티커가 비어있거나 공백만 있는 경우 작업 중단
          TICKER="${{ github.event.inputs.ticker }}"
          if [ -z "$TICKER" ] || [ "$TICKER" = " " ]; then
            echo "❌ [중단] 티커가 입력되지 않았습니다. 워크플로우를 실행하지 않습니다."
            exit 1
          fi
          echo "✅ 입력된 티커 확인: $TICKER"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas supabase python-dotenv

      - name: Run Dedicated Sync Script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          CMD="python core/scraper/us_stock_sync_1yr.py ${{ github.event.inputs.ticker }}"
          echo "Executing: $CMD"
          $CMD
