name: Sector Sync (stocks.sector)

on:
  workflow_dispatch:
    inputs:
      market:
        description: '대상 시장'
        required: true
        default: 'ALL'
        type: choice
        options: [ALL, KR, US]
      force:
        description: '이미 섹터가 있는 종목도 덮어쓰기'
        type: boolean
        default: false
      dry_run:
        description: '테스트 실행 (DB 수정 없이 결과만 확인)'
        type: boolean
        default: true

jobs:
  sync-sector:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: 📦 의존성 설치
      run: |
        python -m pip install --upgrade pip
        pip install pandas supabase yfinance finance-datareader

    - name: 🏷️ 섹터 채우기
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      run: |
        ARGS="--market ${{ inputs.market }}"
        if [ "${{ inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
        if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry_run"; fi
        python core/scraper/sector_sync.py $ARGS | tee sector_sync.log
        { echo '### Sector Sync'; echo '```'; tail -n 40 sector_sync.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
