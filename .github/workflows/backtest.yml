name: Strategy Backtest Workflow

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: '백테스트 시작일 (YYYY-MM-DD)'
        required: true
        default: '2026-01-01'
      end_date:
        description: '백테스트 종료일 (YYYY-MM-DD)'
        required: true
        default: '2026-09-30'

jobs:
  backtest:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 코드 체크아웃
      uses: actions/checkout@v3

    - name: 🐍 Python 환경 설정
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: 📦 의존성 패키지 설치
      run: |
        python -m pip install --upgrade pip
        # 📌 streamlit 및 기타 필요 패키지 추가
        pip install pandas numpy supabase streamlit plotly

    - name: 🚀 기간별 백테스트 실행
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      run: |
        python backtest.py ${{ github.event.inputs.start_date }} ${{ github.event.inputs.end_date }}
